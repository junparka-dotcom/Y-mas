# v20 실험 — v18 대비 관절 드롭아웃 강화
#
# 근거: v19(frac 0.1->0.05, 완화)가 NTU recall 을 떨어뜨려 반증됨
#       => 강한 관절 드롭아웃이 일반화(미답 피험자 낙상 판정)에 기여한다는
#       것이 확인됨. 그렇다면 지렛대를 반대로 당겨본다: frac 0.1 -> 0.15.
#       (25관절 중 ~3~4개 드롭). v18 대비 joint_dropout_frac 하나만 변경.
#
# 위험: 너무 강하면 낙상의 미세 관절 신호까지 뭉개 NTU recall 이 떨어질 수
#       있다. 그래서 1회 실험으로 방향(단조 개선인지 과함인지)을 확인한다.
#
# 성공 판정 (v18 th=0.78, 오경보 67, NTU recall 0.9762 대비):
#   precision>=0.95 유지 & NTU 낙상 recall >= 0.9762 & 오경보 <= 67
#   하나라도 나빠지면 v18 유지, v20 폐기.

data:
  T: 64
  V: 25
  fps: 30.0
  n_phys: 10

train:
  batch_size: 64
  epochs: 40
  lr: 1.0e-3
  weight_decay: 5.0e-4
  warmup_epochs: 3
  label_smooth: 0.15
  focal_gamma: 1.5
  dropout: 0.45
  aux_weight: 0.15
  mixup_alpha: 0.4
  ema_decay: 0.9999
  swa_start_r: 0.75
  seed: 42

  # ---- v18 과 동일 ----
  aug_rot_y: 0.35
  aug_rot_xz: 0.12
  joint_dropout_p: 0.3
  # ---- v20 변경점 (여기만 v18 과 다름) ----
  joint_dropout_frac: 0.15   # 0.1 -> 0.15 (25관절 중 ~3~4개 드롭)

eval:
  precision_gate: 0.95
