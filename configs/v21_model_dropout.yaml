# v21 실험 — v18(확정 augmentation) + model dropout 상향
#
# 근거: 관절 드롭아웃 강도(v19/v20)는 v18 frac=0.10 에서 수렴함이 확인됨.
#       이제 다른 정규화 축을 본다: head/aux_head 의 특징 레벨 dropout
#       0.45 -> 0.50. 관절(입력) 레벨이 아니라 분류기(특징) 레벨 정규화라
#       지금까지와 다른 축. v18 대비 dropout 하나만 변경.
#
# 주의: dropout 은 v13 그리드서치 확정값(0.45)이었다. 상향은 일반화를 더
#       걸지만 과하면 학습 자체가 덜 되어 recall 이 떨어질 수 있다.
#       1회 실험으로 방향 확인.
#
# 성공 판정 (v18 th=0.78, 오경보 67, NTU recall 0.9762 대비):
#   precision>=0.95 유지 & NTU 낙상 recall >= 0.9762 & 오경보 <= 67
#   하나라도 나빠지면 v18 유지, v21 폐기.

data:
  T: 64
  V: 25
  fps: 30.0
  n_phys: 10

train:
  batch_size: 64
  epochs: 40
  lr: 1.0e-3
  weight_decay: 5.0e-4
  warmup_epochs: 3
  label_smooth: 0.15
  focal_gamma: 1.5
  aux_weight: 0.15
  mixup_alpha: 0.4
  ema_decay: 0.9999
  swa_start_r: 0.75
  seed: 42

  # ---- v18 확정 augmentation (동일) ----
  aug_rot_y: 0.35
  aug_rot_xz: 0.12
  joint_dropout_p: 0.3
  joint_dropout_frac: 0.1

  # ---- v21 변경점 (여기만 v18 과 다름) ----
  dropout: 0.5              # 0.45 -> 0.50 (특징 레벨 정규화 강화)

eval:
  precision_gate: 0.95
