<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180" font-family="sans-serif">
  <rect width="900" height="1180" fill="#ffffff"/>
  <text x="450" y="36" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Y-mas MCU 박스 조립 가이드</text>
  <text x="450" y="60" font-size="14" text-anchor="middle" fill="#666">박스 80×60×30mm · ESP32-WROOM-32D 55×26×13mm · PLA 출력</text>

  <!-- ===================== VIEW 1: 단면 (측면) ===================== -->
  <text x="40" y="100" font-size="18" font-weight="bold" fill="#1565c0">① 단면도 (옆에서 본 모습) — 부품이 쌓이는 순서</text>

  <!-- 박스 본체 (단면) -->
  <!-- 바깥 벽 -->
  <rect x="120" y="150" width="520" height="180" fill="none" stroke="#333" stroke-width="3"/>
  <!-- 바닥 두께 -->
  <rect x="120" y="300" width="520" height="30" fill="#d7ccc8" stroke="#333" stroke-width="2"/>
  <text x="380" y="320" font-size="12" text-anchor="middle" fill="#5d4037">박스 바닥 (두께 2.5mm)</text>
  <!-- 좌우 벽 표시 -->
  <rect x="120" y="150" width="16" height="180" fill="#d7ccc8" stroke="#333" stroke-width="1"/>
  <rect x="624" y="150" width="16" height="180" fill="#d7ccc8" stroke="#333" stroke-width="1"/>

  <!-- 스탠드오프 4개 (단면엔 2개 보임) -->
  <rect x="220" y="270" width="18" height="30" fill="#a1887f" stroke="#333" stroke-width="1.5"/>
  <rect x="520" y="270" width="18" height="30" fill="#a1887f" stroke="#333" stroke-width="1.5"/>
  <text x="379" y="290" font-size="11" text-anchor="middle" fill="#4e342e">스탠드오프 (높이 4mm) ×4</text>

  <!-- ESP32 보드 -->
  <rect x="200" y="248" width="360" height="22" fill="#1b5e20" stroke="#111" stroke-width="2"/>
  <text x="380" y="263" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">ESP32-WROOM-32D 보드</text>
  <!-- 보드 위 부품(핀헤더/모듈) -->
  <rect x="210" y="234" width="50" height="14" fill="#455a64" stroke="#111"/>
  <rect x="500" y="234" width="50" height="14" fill="#455a64" stroke="#111"/>
  <text x="380" y="228" font-size="10" text-anchor="middle" fill="#37474f">위쪽 여유 공간 (커넥터/핀헤더)</text>

  <!-- 나사 (스탠드오프에 보드 고정) -->
  <line x1="229" y1="238" x2="229" y2="248" stroke="#c62828" stroke-width="3"/>
  <line x1="529" y1="238" x2="529" y2="248" stroke="#c62828" stroke-width="3"/>
  <text x="150" y="242" font-size="10" fill="#c62828">M2.5 나사</text>

  <!-- 뚜껑 -->
  <rect x="120" y="135" width="520" height="15" fill="#bcaaa4" stroke="#333" stroke-width="2"/>
  <text x="380" y="147" font-size="12" text-anchor="middle" fill="#3e2723">뚜껑 (lid, 두께 2.5mm) — M3 볼트로 체결</text>

  <!-- 케이블 인출구 화살표 -->
  <line x1="136" y1="200" x2="90" y2="200" stroke="#0277bd" stroke-width="3" marker-end="url(#arrowblue)"/>
  <text x="60" y="190" font-size="11" fill="#0277bd">로드셀</text>
  <text x="60" y="204" font-size="11" fill="#0277bd">신호 IN</text>
  <line x1="624" y1="200" x2="680" y2="200" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowgreen)"/>
  <text x="690" y="196" font-size="11" fill="#2e7d32">USB/전원</text>
  <text x="690" y="210" font-size="11" fill="#2e7d32">+ LAN OUT</text>

  <!-- 조립 순서 캡션 -->
  <text x="130" y="360" font-size="13" fill="#333">쌓는 순서 (아래→위):</text>
  <text x="130" y="380" font-size="12" fill="#555">1) 박스 바닥  →  2) 스탠드오프 위에 ESP32 얹기  →  3) M2.5 나사로 고정  →  4) 배선 연결  →  5) 뚜껑 덮고 M3 볼트 4개 조이기</text>

  <!-- ===================== VIEW 2: 위에서 본 배치 ===================== -->
  <text x="40" y="440" font-size="18" font-weight="bold" fill="#1565c0">② 위에서 본 배치 (뚜껑 열고 본 모습)</text>

  <!-- 박스 위에서 -->
  <rect x="120" y="465" width="520" height="380" rx="14" fill="#f5f5f5" stroke="#333" stroke-width="3"/>

  <!-- 뚜껑 체결 기둥 4개 (모서리) -->
  <circle cx="158" cy="503" r="14" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
  <circle cx="602" cy="503" r="14" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
  <circle cx="158" cy="807" r="14" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
  <circle cx="602" cy="807" r="14" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
  <text x="158" cy="503" x2="0" font-size="9" text-anchor="middle" fill="#455a64" transform="translate(0,506)">M3</text>
  <text x="602" font-size="9" text-anchor="middle" fill="#455a64" transform="translate(0,506)">M3</text>
  <text x="380" y="856" font-size="10" text-anchor="middle" fill="#607d8b">모서리 4개 = 뚜껑 체결 기둥 (M3 볼트 + 육각너트 트랩)</text>

  <!-- ESP32 (위에서) -->
  <rect x="235" y="560" width="290" height="190" rx="6" fill="#1b5e20" stroke="#111" stroke-width="2"/>
  <text x="380" y="595" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold">ESP32-WROOM-32D</text>
  <!-- 안테나 표시 -->
  <rect x="235" y="560" width="290" height="26" fill="#2e7d32" opacity="0.6"/>
  <text x="380" y="578" font-size="10" text-anchor="middle" fill="#fff">(안테나 쪽)</text>

  <!-- 스탠드오프 4점 -->
  <circle cx="255" cy="600" r="7" fill="#a1887f" stroke="#4e342e"/>
  <circle cx="505" cy="600" r="7" fill="#a1887f" stroke="#4e342e"/>
  <circle cx="255" cy="710" r="7" fill="#a1887f" stroke="#4e342e"/>
  <circle cx="505" cy="710" r="7" fill="#a1887f" stroke="#4e342e"/>
  <text x="380" y="690" font-size="10" text-anchor="middle" fill="#d7ccc8">← 스탠드오프 4점 (여기에 나사로 보드 고정) →</text>

  <!-- 좌측 케이블 인출구 (로드셀 신호 IN) -->
  <rect x="112" y="632" width="16" height="46" fill="#0277bd"/>
  <text x="70" y="650" font-size="11" fill="#0277bd">HX711</text>
  <text x="70" y="664" font-size="11" fill="#0277bd">4채널</text>
  <text x="70" y="678" font-size="11" fill="#0277bd">신호 IN</text>

  <!-- 우측 케이블 인출구 (USB/전원 + LAN OUT) -->
  <rect x="632" y="638" width="16" height="34" fill="#2e7d32"/>
  <text x="660" y="650" font-size="11" fill="#2e7d32">USB/전원</text>
  <text x="660" y="664" font-size="11" fill="#2e7d32">+LAN OUT</text>

  <!-- ===================== VIEW 3: 전체 배선 연결도 ===================== -->
  <text x="40" y="920" font-size="18" font-weight="bold" fill="#1565c0">③ 전체 배선 연결도 (무엇을 어디에 꽂나)</text>

  <!-- 로드셀 4개 -->
  <g>
    <rect x="40" y="955" width="90" height="34" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="85" y="976" font-size="11" text-anchor="middle" fill="#e65100">로드셀 FL</text>
    <rect x="40" y="995" width="90" height="34" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="85" y="1016" font-size="11" text-anchor="middle" fill="#e65100">로드셀 FR</text>
    <rect x="40" y="1035" width="90" height="34" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="85" y="1056" font-size="11" text-anchor="middle" fill="#e65100">로드셀 RL</text>
    <rect x="40" y="1075" width="90" height="34" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="85" y="1096" font-size="11" text-anchor="middle" fill="#e65100">로드셀 RR</text>
  </g>

  <!-- HX711 4개 -->
  <g>
    <rect x="200" y="955" width="80" height="34" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="240" y="976" font-size="11" text-anchor="middle" fill="#2e7d32">HX711 #1</text>
    <rect x="200" y="995" width="80" height="34" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="240" y="1016" font-size="11" text-anchor="middle" fill="#2e7d32">HX711 #2</text>
    <rect x="200" y="1035" width="80" height="34" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="240" y="1056" font-size="11" text-anchor="middle" fill="#2e7d32">HX711 #3</text>
    <rect x="200" y="1075" width="80" height="34" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="240" y="1096" font-size="11" text-anchor="middle" fill="#2e7d32">HX711 #4</text>
  </g>

  <!-- 로드셀 -> HX711 연결선 -->
  <line x1="130" y1="972" x2="200" y2="972" stroke="#e65100" stroke-width="2" marker-end="url(#arrowor)"/>
  <line x1="130" y1="1012" x2="200" y2="1012" stroke="#e65100" stroke-width="2" marker-end="url(#arrowor)"/>
  <line x1="130" y1="1052" x2="200" y2="1052" stroke="#e65100" stroke-width="2" marker-end="url(#arrowor)"/>
  <line x1="130" y1="1092" x2="200" y2="1092" stroke="#e65100" stroke-width="2" marker-end="url(#arrowor)"/>

  <!-- ESP32 (연결도) -->
  <rect x="380" y="985" width="150" height="95" rx="6" fill="#1b5e20" stroke="#111" stroke-width="2"/>
  <text x="455" y="1010" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">ESP32</text>
  <text x="455" y="1030" font-size="10" text-anchor="middle" fill="#c8e6c9">SCK=GPIO4 (공유)</text>
  <text x="455" y="1046" font-size="10" text-anchor="middle" fill="#c8e6c9">DT: 32/33/25/27</text>
  <text x="455" y="1062" font-size="10" text-anchor="middle" fill="#c8e6c9">(W5500 모드)</text>

  <!-- HX711 -> ESP32 -->
  <line x1="280" y1="1005" x2="380" y2="1015" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <line x1="280" y1="1052" x2="380" y2="1040" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <text x="330" y="1000" font-size="9" fill="#555">SCK공유+DT</text>

  <!-- W5500 -->
  <rect x="600" y="955" width="90" height="44" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="645" y="972" font-size="11" text-anchor="middle" fill="#1565c0">W5500</text>
  <text x="645" y="988" font-size="9" text-anchor="middle" fill="#1565c0">이더넷(LAN)</text>
  <line x1="530" y1="1010" x2="600" y2="990" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowblue2)"/>
  <text x="548" y="1000" font-size="9" fill="#555">SPI</text>

  <!-- Jetson -->
  <rect x="600" y="1030" width="120" height="50" rx="4" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="660" y="1050" font-size="11" text-anchor="middle" fill="#6a1b9a">Jetson AGX Orin</text>
  <text x="660" y="1066" font-size="9" text-anchor="middle" fill="#6a1b9a">192.168.0.9:5005</text>
  <line x1="690" y1="999" x2="690" y2="1030" stroke="#6a1b9a" stroke-width="2" marker-end="url(#arrowpur)"/>
  <text x="700" y="1018" font-size="9" fill="#555">UDP</text>

  <text x="40" y="1150" font-size="11" fill="#888">주: 로드셀 4개 → HX711 4개(SCK 공유) → ESP32 → W5500 이더넷 → Jetson UDP 전송. HX711은 각자 소형 박스(34×24×16)에, ESP32+W5500은 중앙 박스(80×60×30)에.</text>

  <!-- arrow markers -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0277bd"/></marker>
    <marker id="arrowblue2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/></marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/></marker>
    <marker id="arrowor" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e65100"/></marker>
    <marker id="arrowpur" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6a1b9a"/></marker>
  </defs>
</svg>
